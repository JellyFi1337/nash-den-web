[project]
name = "nash-den"
version = "2.0.0"
description = "Наш день — закрытый сайт команды и бот в Telegram"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3,<4",
    "django>=5.2,<5.3",
    "django-environ>=0.11,<1",
    "gunicorn>=23,<24",
    "openpyxl>=3.1,<4",
    "pillow>=12.3,<13",
    "psycopg[binary]>=3.2,<4",
    "whitenoise>=6,<7",
]

[dependency-groups]
dev = [
    "factory-boy>=3,<4",
    "pytest>=8,<9",
    "pytest-django>=4.9,<5",
    "ruff>=0.9,<1",
    "time-machine>=2.16,<3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
src = ["src"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.lint.per-file-ignores]
"src/config/settings/{dev,prod,test}.py" = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["src"]
testpaths = ["src"]
cache_dir = "/tmp/pytest_cache"
# pytest-django берёт переменную окружения раньше значения выше, а в контейнере она указывает на dev.
addopts = "--ds=config.settings.test"
