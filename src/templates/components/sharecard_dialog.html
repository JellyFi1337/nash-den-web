<dialog class="sharecard-dialog" id="sharecard-dialog" aria-labelledby="sharecard-title">
    <div class="sharecard-dialog__head">
        <h2 class="h-card" id="sharecard-title">Карточка цитаты</h2>
        <button class="chip" type="button" data-sharecard-close autofocus>Закрыть</button>
    </div>
    <p class="source-note" role="status" data-sharecard-status>Готовим карточку…</p>
    <img class="sharecard-preview" width="1080" height="1350" alt="Карточка цитаты дня" data-sharecard-preview hidden>
    <div class="sharecard-dialog__actions">
        <button class="btn" type="button" data-sharecard-save disabled>Сохранить</button>
        <button class="btn btn--ghost" type="button" data-sharecard-share hidden>Поделиться</button>
    </div>
</dialog>
