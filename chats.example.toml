# Образец файла конфигурации чатов.
# Скопируйте его в chats.toml и заполните. Файл chats.toml содержит настоящие имена
# и в git не попадает. Описание — в docs/CHATS_CONFIG.md.
#
# Идентификаторы чата и тем подскажет бот: команда /chats в личных сообщениях.
# Имена пользователей и идентификаторы людей: команда /people.

version = 1

[[chats]]
id = -1001234567890
name = "МИР ВОЗМОЖНОСТЕЙ | 9 поток"

  # role: journal — утренние декларации и вечерние итоги; project — общественный проект;
  #       task — задания и инсайты; "" — прочее.
  # export: выгружать тему в txt.  ai: тема нужна нейросети для отчёта.

  [[chats.topics]]
  thread_id = 0            # 0 — тема General (у её сообщений нет номера темы)
  name = "General"
  file = "general"
  role = ""
  export = true
  ai = false

