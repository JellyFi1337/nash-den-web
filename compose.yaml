name: nash-den

services:
  db:
    image: postgres:17.11
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      target: prod
    image: nashden-web
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - media_data:/app/media
      - ./private:/app/private:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  bot:
    image: nashden-web
    pull_policy: never
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./private:/app/private:ro
    command:
      - python
      - /app/src/manage.py
      - runbot
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,sys,time; p='/tmp/nashden-bot-alive'; sys.exit(0 if os.path.isfile(p) and time.time()-os.path.getmtime(p)<120 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 2
      start_period: 60s
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
