# Продакшен на Ubuntu. Запуск: docker compose -f compose.yaml -f compose.prod.yaml up -d --build
# Файл .env и корень проекта в контейнеры не монтируются. Рядом лежит только ./private.

services:
  web:
    volumes:
      - backup_data:/backups
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      RUN_MIGRATIONS: "1"
      TRUSTED_PROXY_COUNT: "1"
      DJANGO_SECURE_COOKIES: "1"
      DJANGO_HSTS_SECONDS: "31536000"
      # connect_timeout не обрывает зависший DNS, когда имя базы уже исчезло.
      RES_OPTIONS: "timeout:1 attempts:1"
    healthcheck:
      start_period: 60s

  bot:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      RUN_MIGRATIONS: "0"
      TRUSTED_PROXY_COUNT: "1"
      DJANGO_SECURE_COOKIES: "1"
      DJANGO_HSTS_SECONDS: "31536000"

  caddy:
    build:
      context: .
      dockerfile: docker/caddy/Dockerfile
    image: nashden-caddy
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    image: nashden-backup
    environment:
      PGHOST: db
      PGPORT: ${POSTGRES_PORT}
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - backup_data:/backups
      - media_data:/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # 26 часов: файл alive старше этого — копия устарела, сервис нездоров.
      test: ["CMD-SHELL", "find /backups/alive -mmin -1560 | grep -q alive"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  backup_data:
